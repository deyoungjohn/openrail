[workspace]
resolver = "2"
members = [
  "contracts/openrail",
  "contracts/vault",
  "contracts/model",
  "contracts/mocks/signer",
  "contracts/mocks/usdc",
  "contracts/mocks/intents",
  "contracts/mocks/nft_receiver",
  "contracts/tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
