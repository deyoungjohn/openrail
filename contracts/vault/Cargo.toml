[package]
name = "openrail-vault"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Points the sandbox/testnet builds at the testnet MPC signer.
testnet = []

[dependencies]
near-sys = "0.4.0"

# Not referenced by the contract. cargo-near reads `[package.metadata.near]` from the resolved
# near-sdk package to pick the protocol ceiling; without it, a rustc >= 1.87 build is refused.
# It is wasm32-only so host builds (unit tests) never compile near-sdk as a plain dependency.
[target.'cfg(target_arch = "wasm32")'.dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable"] }

[dev-dependencies]
near-workspaces = { version = "=0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
anyhow = "1"
serde_json = "1"
