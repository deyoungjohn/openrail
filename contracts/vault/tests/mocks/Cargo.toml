[package]
name = "openrail-vault-mock"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Standalone: this crate is a test fixture, not a workspace member.
[workspace]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
