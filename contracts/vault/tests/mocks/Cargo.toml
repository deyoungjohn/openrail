[package]
name = "openrail-vault-mock"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Standalone: this crate is a test fixture, not a workspace member.
[workspace]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable"] }
# This fixture has no lockfile of its own. near-sys 0.4.1 (published 5 Nov 14:24 UTC) removed the
# universal_state functions that near-sdk 5.30.0 calls, so pin the version the workspace lock uses.
near-sys = "=0.4.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
