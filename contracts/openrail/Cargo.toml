[package]
name = "openrail"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository = "https://github.com/deyoungjohn/openrail"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable"] }

# One empty feature per module enabled in openrail.modules.json.
# P0.2 keeps this table in sync with that file.
[features]
standing = []
checkout = []
proof = []
shopify = []
settle = []
woocommerce = []

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable", "unit-testing"] }
# Pure-Rust ECDSA recovery for the EIP-712 vectors (production uses env::ecrecover).
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--features",
    "standing,checkout,proof,shopify,settle,woocommerce",
]
