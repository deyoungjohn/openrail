[package]
name = "openrail"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable"] }

# One empty feature per module enabled in openrail.modules.json.
# P0.2 keeps this table in sync with that file.
[features]
standing = []
checkout = []
advance = []
proof = []
agent = []
shopify = []
subscriptions = []

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable", "unit-testing"] }
# Pure-Rust ECDSA recovery for the EIP-712 vectors (production uses env::ecrecover).
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
