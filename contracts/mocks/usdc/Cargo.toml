[package]
name = "openrail-mock-usdc"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unstable", "unit-testing"] }
near-workspaces = { version = "=0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde_json = "1"
