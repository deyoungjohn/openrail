# Learn more about configuring a checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

api_version = "2025-10"

[[extensions]]
name = "Openrail Stablecoin Payment Block"
handle = "openrail-thank-you-block"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/ThankYouBlock.tsx"
target = "purchase.thank-you.block.render"

[[extensions.targeting]]
module = "./src/ThankYouBlock.tsx"
target = "customer-account.order-status.block.render"

[extensions.capabilities]
api_access = true
network_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "openrail_app_base_url"
type = "single_line_text_field"
name = "Openrail App Base URL"
description = "HTTPS base URL of the Openrail Shopify connector (for example https://shopify.openrail.incepture.dev)."
