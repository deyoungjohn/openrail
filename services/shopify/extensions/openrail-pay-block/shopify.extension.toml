# Learn more about configuring a checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

api_version = "2025-10"

[[extensions]]
name = "Openrail Pay Block"
handle = "openrail-pay-block"
type = "ui_extension"

# During checkout, before anything is bought: how paying with stablecoins works.
[[extensions.targeting]]
module = "./src/CheckoutNotice.tsx"
target = "purchase.checkout.block.render"

# After the order is placed (the thank-you page): the payment link.
[[extensions.targeting]]
module = "./src/Extension.tsx"
target = "purchase.thank-you.block.render"

[extensions.capabilities]
api_access = true
network_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "openrail_app_base_url"
type = "single_line_text_field"
name = "Openrail App Base URL"
description = "HTTPS base URL of the Openrail Shopify connector (for example https://shopify.openrail.incepture.dev)."
