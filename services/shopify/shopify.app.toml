# Learn more about configuring your app at https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration

name = "Openrail Checkout"
client_id = "60c714696b8435c0259363c5e1f282e3"
application_url = "https://shopify.openrail.incepture.dev"
embedded = false

[access_scopes]
# The scopes the human chose in the Dev Dashboard (for flexibility). The connector itself uses read_orders and write_orders.
scopes = "read_orders,write_orders,read_products,write_products,read_inventory,write_inventory,read_customers,write_customers,read_fulfillments,write_fulfillments,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_draft_orders,write_draft_orders,read_discounts,write_discounts,read_price_rules,write_price_rules,read_locations,read_files,write_files"
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[webhooks]
api_version = "2025-10"

# No app-subscribed webhook: orders/create carries protected customer data, which the app is not approved for (the
# release fails). The webhook is created in the store admin instead (Settings > Notifications > Webhooks > Create
# webhook, event "Order creation", format JSON, URL https://shopify.openrail.incepture.dev/shopify/webhooks); it is
# signed with the store webhook key, which goes in SHOPIFY_WEBHOOK_SECRET.

[build]
automatically_update_urls_on_dev = false
