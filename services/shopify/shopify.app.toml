name = "Openrail Payments"
client_id = "60c714696b8435c0259363c5e1f282e3"
application_url = "https://shopify.openrail.incepture.dev"
embedded = false

[access_scopes]
# Scopes required for inspecting USD orders and marking them paid on settlement
scopes = "read_orders,write_orders"

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
topics = [ "orders/create" ]
uri = "https://shopify.openrail.incepture.dev/shopify/webhooks"

[build]
automatically_update_urls_on_dev = false
